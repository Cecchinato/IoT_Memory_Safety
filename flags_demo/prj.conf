# picolibc is needed for the "_chk" functions
CONFIG_PICOLIBC=y
#CONFIG_PICOLIBC_IO_SUPPORT=y

# =n because i want to controll it with Cmake and not with kconfig
CONFIG_STACK_CANARIES=n

CONFIG_MAIN_STACK_SIZE=4096

# richiesto quando -fstack-protector-strong e' attivo: picolibc
# semina il canary chiamando getentropy(), che ha bisogno di un
# device driver di entropia compilato nel devicetree. Su native_sim
# non e' abilitato di default -> senza questo, la build HARDENED
# della demo canary fallisce in fase di link (device_dts_ord
# indefinito).
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
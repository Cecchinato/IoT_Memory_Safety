# This is the non-secure Zephyr image. Building it against the
# mps2/an521/cpu0/ns board target pulls in TF-M as the secure world
# automatically, TF-M owns the SAU/IDAU setup and boots first.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TRUSTED_EXECUTION_NONSECURE=y

CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_STDOUT_CONSOLE=y


CONFIG_BUILD_OUTPUT_META=y  #SPDX flag for CMake metadata
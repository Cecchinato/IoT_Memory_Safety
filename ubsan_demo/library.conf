# UBSan, library mode: on undefined behavior, call into a runtime that prints
# the source location, the check that failed, and the values involved.
#
# Requires ARCH_POSIX (native_sim -> host libubsan) or PICOLIBC (mps2/an385 ->
# picolibc's __ubsan_handle_* set). Both are satisfied by the boards this demo
# targets.
CONFIG_UBSAN=y
CONFIG_UBSAN_LIBRARY=y

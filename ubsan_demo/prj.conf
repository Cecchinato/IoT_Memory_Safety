# Common settings, always applied. No sanitizer here: this file alone is the
# baseline profile, where every bug below is undefined behavior that nothing
# reports.
CONFIG_PRINTK=y

# Needed by the trap profile on mps2/an385: without it the fault handler does
# not print the register dump, and there is no PC to feed to addr2line.
CONFIG_EXCEPTION_DEBUG=y

CONFIG_MAIN_STACK_SIZE=4096

# -Og. Zephyr defaults to -Os, and at -Os GCC folds most of these expressions
# at compile time, which removes the runtime check the demo is trying to show.
# The volatile inputs in main.c are the primary defense against that; this is
# the belt-and-braces half.
CONFIG_DEBUG_OPTIMIZATIONS=y
